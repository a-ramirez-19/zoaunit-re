name: Empaquetar

# Junta los .rds de los artefactos de una o varias corridas de Simulacion, calcula los resultados por
# réplica y las métricas de cada enlace (como el qmd) y publica todo como un release:
#   cache_<version>_<enlace>.tar      los .rds para copiar a _cache_simulacion_asesor
#   resultados_<version>.zip          carpeta de resultados del qmd (por réplica, métricas y faltantes)
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "IDs de las corridas de Simulacion, separados por coma"
        required: true
      version:
        description: "v4uw, v4kum o v4"
        required: true
        default: "v4uw"
      etiqueta:
        description: "Etiqueta del release (p. ej. uwv4)"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  empaquetar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Instalar R y JAGS
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            r-base-core jags r-cran-rjags r-cran-coda r-cran-dplyr zip

      - name: Descargar artefactos
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
        run: |
          mkdir -p _cache_simulacion_asesor registro
          for r in ${RUNS//,/ }; do
            gh run download "$r" -R "$GITHUB_REPOSITORY" -D "art_$r"
          done
          find art_* -name '*.rds' -exec mv -n {} _cache_simulacion_asesor/ \;
          find art_* -name '*.csv' -path '*registro*' -exec mv -n {} registro/ \;
          rm -rf art_*
          ls _cache_simulacion_asesor | sed -E 's/_tau.*//' | sort | uniq -c

      - name: Resultados por enlace
        # Para Unit-Gamma (v4) parte de los ajustes está solo en el portátil: no se calculan resultados aquí
        # (los genera el render local del qmd), para no publicar métricas incompletas.
        if: inputs.version != 'v4'
        env:
          VERSION: ${{ inputs.version }}
          CACHE_DIR: _cache_simulacion_asesor
        run: |
          for e in logit probit cloglog; do ENLACE=$e Rscript resumir_resultados.R; done
          case "$VERSION" in v4uw) D=resultados_sim2_v4_uw;; v4kum) D=resultados_sim2_v4_kum;; *) D="resultados_sim2_${VERSION}";; esac
          cp -r registro "$D/registro_github"
          zip -qr "resultados_${VERSION}.zip" "$D"

      - name: Comprimir caché por enlace
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for e in logit probit cloglog; do
            ( cd _cache_simulacion_asesor && ls | grep "_${e}_" > "../lista_${VERSION}_${e}.txt" || true )
            if [ -s "lista_${VERSION}_${e}.txt" ]; then
              tar -cf "cache_${VERSION}_${e}.tar" -C _cache_simulacion_asesor -T "lista_${VERSION}_${e}.txt"
            fi
          done
          ls -l *.tar *.zip

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.etiqueta }}" -R "$GITHUB_REPOSITORY" \
            --title "${{ inputs.etiqueta }}" --notes "Version ${{ inputs.version }}; corridas: ${{ inputs.runs }}" \
            cache_*.tar lista_*.txt $(ls resultados_*.zip 2>/dev/null)
