name: Simulacion

on:
  workflow_dispatch:
    inputs:
      version:
        description: "v4uw (Unit-Weibull), v4kum (Kumaraswamy) o v4 (Unit-Gamma)"
        required: true
        default: "v4uw"
      enlaces:
        description: "Enlaces separados por coma"
        required: true
        default: "logit,probit,cloglog"
      taus:
        description: "Cuantiles separados por coma"
        required: true
        default: "0.25,0.50,0.75"
      n_sujetos:
        description: "Tamaños de muestra separados por coma"
        required: true
        default: "30,50,100,200,500"
      rep_ini:
        description: "Primera réplica"
        required: true
        default: "1"
      rep_fin:
        description: "Última réplica"
        required: true
        default: "500"
      n_bloques:
        description: "Trabajos por enlace (GitHub corre 20 a la vez en total)"
        required: true
        default: "16"
      horas_max:
        description: "Horas tras las cuales un trabajo no empieza ajustes nuevos"
        required: true
        default: "5"

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      matriz: ${{ steps.m.outputs.matriz }}
    steps:
      - id: m
        env:
          ENLACES: ${{ inputs.enlaces }}
          N_BLOQUES: ${{ inputs.n_bloques }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          enl = [e.strip() for e in os.environ["ENLACES"].split(",") if e.strip()]
          nb = int(os.environ["N_BLOQUES"])
          inc = [{"enlace": e, "bloque": b} for e in enl for b in range(1, nb + 1)]
          assert len(inc) <= 256, "Máximo 256 trabajos por corrida"
          print("matriz=" + json.dumps({"include": inc}))
          PY

  ajustar:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preparar.outputs.matriz) }}
    name: ${{ inputs.version }} ${{ matrix.enlace }} bloque ${{ matrix.bloque }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar R y JAGS
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            r-base-core jags r-cran-rjags r-cran-coda r-cran-dplyr
          R --version | head -1
          nproc

      - name: Ajustar
        env:
          VERSION: ${{ inputs.version }}
          ENLACE: ${{ matrix.enlace }}
          TAUS: ${{ inputs.taus }}
          N_SUJETOS: ${{ inputs.n_sujetos }}
          REP_INI: ${{ inputs.rep_ini }}
          REP_FIN: ${{ inputs.rep_fin }}
          BLOQUE: ${{ matrix.bloque }}
          N_BLOQUES: ${{ inputs.n_bloques }}
          HORAS_MAX: ${{ inputs.horas_max }}
          CACHE_DIR: _cache_simulacion_asesor
        run: Rscript run_bloque.R

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-${{ inputs.version }}-${{ matrix.enlace }}-${{ github.run_id }}-bloque${{ matrix.bloque }}
          path: |
            _cache_simulacion_asesor/
            registro/
          if-no-files-found: warn
          retention-days: 30
